<div class="h-full flex justify-center py-2 px-10">
  <div class="relative overflow-x-auto shadow-md sm:rounded-lg w-full">
    <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
      <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
      <tr>
        <th scope="col" class="px-6 py-3">
          Product name
        </th>
        <th scope="col" class="px-6 py-3">
          With Image
        </th>
        <th scope="col" class="px-6 py-3">
          Rating
        </th>
        <th scope="col" class="px-6 py-3">
          Price
        </th>
        <th scope="col" class="px-6 py-3">
          <a routerLink="0" class="font-medium text-blue-600 dark:text-blue-500 hover:underline">New</a>
        </th>
      </tr>
      </thead>
      <tbody>

        @for (product of products | async; track product.id) {
          <tr class="odd:bg-white odd:dark:bg-gray-900 even:bg-gray-50 even:dark:bg-gray-800 border-b dark:border-gray-700 border-gray-200">
        <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
          {{product.name}}
        </th>
        <td class="px-6 py-4">
          {{!!product.src}}
        </td>
        <td class="px-6 py-4">
          {{product.rating}}
        </td>
        <td class="px-6 py-4">
          ${{product.price}}
        </td>
        <td class="px-6 py-4">
          <a routerLink="{{product.id}}" class="font-medium text-blue-600 dark:text-blue-500 hover:underline">Edit</a>
        </td>
      </tr>
        }
      </tbody>
    </table>
  </div>

</div>
